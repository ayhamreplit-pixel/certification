name: Live Stream 1080p50

on:
  workflow_dispatch:

concurrency:
  group: live-stream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SOURCE_URL: "http://46.249.110.247/g/g/1484094?"
      RTMP_URL: "rtmp://vsu.okcdn.ru/input/12590548983404_11747794029164_rjxxwplwjm"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-venv
          python3 -m venv "$RUNNER_TEMP/streamlink-venv"
          "$RUNNER_TEMP/streamlink-venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/streamlink-venv/bin/python" -m pip install --quiet streamlink
          echo "$RUNNER_TEMP/streamlink-venv/bin" >> "$GITHUB_PATH"

      - name: Validate stream info
        run: |
          set -eu
          ffmpeg -version | head -1
          streamlink --version

      - name: Test source
        run: |
          set +e
          SOURCE_REFERER="$(python3 -c 'import sys; from urllib.parse import urlsplit; u=urlsplit(sys.argv[1]); print(f"{u.scheme}://{u.netloc}/")' "$SOURCE_URL")"
          curl --silent --show-error --location \
            --max-time 10 \
            --user-agent "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36" \
            --referer "$SOURCE_REFERER" \
            "$SOURCE_URL" | head -c 1024 > /dev/null
          echo "Source probe check passed."

      - name: Start continuous stream and auto-recovery
        run: |
          set -u
          SOURCE_REFERER="$(python3 -c 'import sys; from urllib.parse import urlsplit; u=urlsplit(sys.argv[1]); print(f"{u.scheme}://{u.netloc}/")' "$SOURCE_URL")"
          FAIL=0
          MAX=9999

          while [ "$FAIL" -lt "$MAX" ]; do
            echo "Starting stable stream attempt $((FAIL + 1)) at $(date -u +%FT%TZ)"

            # محاولة التشغيل المباشر عبر FFmpeg مع خاصية إعادة الاتصال الذاتي لمصدر الـ TS ولـ ok.ru
            ffmpeg \
              -nostdin \
              -hide_banner \
              -loglevel warning \
              -stats \
              -user_agent "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36" \
              -headers "Referer: $SOURCE_REFERER\r\n" \
              -reconnect 1 \
              -reconnect_streamed 1 \
              -reconnect_delay_max 5 \
              -thread_queue_size 4096 \
              -i "$SOURCE_URL" \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=50,format=yuv420p" \
              -c:v libx264 \
              -preset superfast \
              -tune film \
              -profile:v high \
              -level 4.2 \
              -b:v 8000k \
              -maxrate 8000k \
              -bufsize 16000k \
              -g 100 \
              -keyint_min 50 \
              -sc_threshold 0 \
              -r 50 \
              -c:a aac \
              -b:a 160k \
              -ar 48000 \
              -ac 2 \
              -max_muxing_queue_size 4096 \
              -f flv \
              "$RTMP_URL" 2>>ffmpeg.log || EXIT=$?

            EXIT=$?
            echo "Stream pipeline exited with code $EXIT."
            echo "Recent FFmpeg output:"
            tail -20 ffmpeg.log 2>/dev/null || true

            FAIL=$((FAIL + 1))
            WAIT=5
            echo "Reconnecting in ${WAIT}s (attempt $FAIL)..."
            sleep "$WAIT"
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-stream-logs
          path: |
            streamlink.log
            ffmpeg.log
          retention-days: 3
          if-no-files-found: ignore
